name: movie-app

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: movie_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-movie_app_dev}
      POSTGRES_DB: movie_app
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h localhost: the temporary server used during init only listens on a socket
      test: ["CMD-SHELL", "pg_isready -h localhost -U movie_app -d movie_app"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://movie_app:${POSTGRES_PASSWORD:-movie_app_dev}@db:5432/movie_app
      # Read from .env. Leave it unset to run without the Claude conversation.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://localhost:8000/api/health', timeout=3)"
      interval: 3s
      timeout: 5s
      retries: 20

  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5173/"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  db_data:
