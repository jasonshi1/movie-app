name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Start database
        run: docker compose up -d --wait db
      - name: Install
        working-directory: backend
        # Editable: the pipeline finds db/init, data/ and results/ relative to the repository.
        run: pip install -e ".[dev,pipeline]"
      - name: Lint
        working-directory: backend
        run: ruff check .
      - name: Test
        working-directory: backend
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  full-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start everything with one command
        run: docker compose up -d --build --wait
      - name: Backend reports a healthy database
        run: curl -fsS http://localhost:8000/api/health
      - name: Frontend reaches the backend through its proxy
        run: curl -fsS http://localhost:5173/api/health
      - name: Show logs on failure
        if: failure()
        run: docker compose logs

  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No commit credits Claude as an author or co-author
        run: |
          status=0
          for sha in $(git rev-list HEAD); do
            if git show -s --format='%an <%ae>%n%cn <%ce>%n%B' "$sha" \
                | grep -qiE '^[[:space:]]*co-authored-by:.*(claude|anthropic)|@anthropic\.com'; then
              echo "::error::$(git show -s --format='%h %s' "$sha") credits Claude. Remove the Co-Authored-By line and push again."
              status=1
            fi
          done
          exit $status
