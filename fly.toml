# fly.toml app configuration file generated for movie-app-5rudha on 2026-11-11T01:38:04Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'movie-app-5rudha'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  CLIENT_IP_HEADER = 'Fly-Client-IP'
  DAILY_SPEND_LIMIT_USD = '5'
  PUBLIC_HOSTS = 'tonights-pick.fly.dev'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
