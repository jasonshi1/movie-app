# Fly.io deployment. See "Launch on Fly.io and Neon" in the README.
# App names are global on Fly.io: if this one is taken, change it here and in PUBLIC_HOSTS.
app = "tonights-pick"
primary_region = "yyz"

[build]
  dockerfile = "Dockerfile"

# Secrets (DATABASE_URL, ANTHROPIC_API_KEY) are set with `fly secrets set`, never here.
[env]
  PUBLIC_HOSTS = "tonights-pick.fly.dev"
  # Set by Fly's proxy, and visitors can't forge it, unlike X-Forwarded-For.
  CLIENT_IP_HEADER = "Fly-Client-IP"
  DAILY_SPEND_LIMIT_USD = "5"

[http_service]
  internal_port = 8000
  force_https = true
  # Always on, so the link opens straight away instead of waiting for the model to load.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
